services:
  # 1. Primary Relational Database (PostgreSQL) - Core Only
  postgres:
    image: postgres:16-alpine
    container_name: pravah-postgres
    restart: always
    profiles: ["core"]
    environment:
      POSTGRES_USER: admin_postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: pravah_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Local S3-Compatible Origin Storage (MinIO) - Core Only
  minio:
    image: minio/minio:latest
    container_name: pravah-minio
    restart: always
    profiles: ["core"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin_minio
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9000:9000" # S3 API Port
      - "9001:9001" # Web Dashboard Console
    volumes:
      - minio_data:/data

  # 3. Message Broker (Kafka compatible via Redpanda) - Core Only
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: pravah-redpanda
    profiles: ["core"]
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644" # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  # 4. Redis - Needed by both Core (Queues) and Edge (Cache)
  redis:
    image: redis:7-alpine
    container_name: pravah-redis
    restart: always
    profiles: ["core", "edge"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 5. Core Application
  core-app:
    build:
      context: .
      dockerfile: Dockerfile.core
    container_name: pravah-core
    restart: always
    profiles: ["core"]
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://admin_postgres:postgres_password@postgres:5432/pravah_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BROKERS=redpanda:9092
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
    env_file:
      - .env
    depends_on:
      - postgres
      - minio
      - redpanda
      - redis

  # 6. Edge Application
  edge-app:
    build:
      context: .
      dockerfile: Dockerfile.edge
    container_name: pravah-edge
    restart: always
    profiles: ["edge"]
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BROKERS=redpanda:9092
      - CORE_API_URL=http://core-app:3000
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
    env_file:
      - .env
    depends_on:
      - redis
      - redpanda
      - minio

volumes:
  postgres_data:
  redis_data:
  minio_data:
  redpanda_data:
