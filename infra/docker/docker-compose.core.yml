services:
  # 1. PostgreSQL (Metadata & Edge Node Registry)
  postgres:
    image: postgres:16-alpine
    container_name: pravah-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin_postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-pravah_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pravah-net

  # 2. Redis (Core State, BullMQ Replication Queue & Heartbeats)
  redis:
    image: redis:7-alpine
    container_name: pravah-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - pravah-net

  # 3. Redpanda / Kafka (Distributed Event Bus)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: pravah-redpanda
    restart: always
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092,OUTSIDE://${CORE_PUBLIC_IP:-localhost}:19092
      - --set redpanda.enable_sasl=true
      - --set redpanda.superusers=['admin']
    ports:
      - "127.0.0.1:9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - pravah-net

  # 3b. Kafka / Redpanda Bootstrap & SASL Provisioning
  kafka-init:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: pravah-kafka-init
    depends_on:
      redpanda:
        condition: service_started
    environment:
      - KAFKA_ADMIN_PASSWORD=${KAFKA_ADMIN_PASSWORD}
      - KAFKA_SASL_USERNAME=${KAFKA_SASL_USERNAME:-pravah-core}
      - KAFKA_SASL_PASSWORD=${KAFKA_SASL_PASSWORD}
      - KAFKA_EDGE_SASL_USERNAME=${KAFKA_EDGE_SASL_USERNAME:-pravah-edge}
      - KAFKA_EDGE_SASL_PASSWORD=${KAFKA_EDGE_SASL_PASSWORD}
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        echo 'waiting for redpanda...';
        until rpk cluster health -X admin.hosts=redpanda:9644 >/dev/null 2>&1 || (rpk security user list -X admin.hosts=redpanda:9644 >/dev/null 2>&1); do sleep 2; done;
        echo 'brokers ready';
        until (rpk security user list -X admin.hosts=redpanda:9644 >/dev/null 2>&1); do sleep 2; done;
        if (rpk security user list -X admin.hosts=redpanda:9644 2>/dev/null) | grep -qx "$${KAFKA_SASL_USERNAME}"; then
          echo 'core user exists';
        else
          rpk security user create "$${KAFKA_SASL_USERNAME}" --password "$${KAFKA_SASL_PASSWORD}" --mechanism scram-sha-256 -X admin.hosts=redpanda:9644;
        fi;
        if (rpk security user list -X admin.hosts=redpanda:9644 2>/dev/null) | grep -qx "$${KAFKA_EDGE_SASL_USERNAME}"; then
          echo 'edge user exists';
        else
          rpk security user create "$${KAFKA_EDGE_SASL_USERNAME}" --password "$${KAFKA_EDGE_SASL_PASSWORD}" --mechanism scram-sha-256 -X admin.hosts=redpanda:9644;
        fi;
        if (rpk security user list -X admin.hosts=redpanda:9644 2>/dev/null) | grep -qx 'admin'; then
          echo 'admin user exists';
        else
          rpk security user create admin --password "$${KAFKA_ADMIN_PASSWORD}" --mechanism scram-sha-256 -X admin.hosts=redpanda:9644;
        fi;
        echo 'SASL users provisioned';

        rpk security acl create "$${KAFKA_SASL_USERNAME}" --topic 'file.*' --operation read,write 2>/dev/null || true;
        rpk security acl create "$${KAFKA_SASL_USERNAME}" --topic 'cache.*' --operation read,write 2>/dev/null || true;
        rpk security acl create "$${KAFKA_SASL_USERNAME}" --topic 'edge.*' --operation read,write 2>/dev/null || true;
        rpk security acl create "$${KAFKA_SASL_USERNAME}" --topic 'replication.*' --operation read,write 2>/dev/null || true;
        rpk security acl create "$${KAFKA_SASL_USERNAME}" --topic 'video.*' --operation read,write 2>/dev/null || true;
        rpk security acl create "$${KAFKA_EDGE_SASL_USERNAME}" --topic 'cache.*' --operation read,write 2>/dev/null || true;
        rpk security acl create "$${KAFKA_EDGE_SASL_USERNAME}" --topic 'edge.*' --operation read,write 2>/dev/null || true;

        ADMIN_ARGS="--brokers redpanda:9092 --user admin --password $${KAFKA_ADMIN_PASSWORD} --sasl-mechanism scram-sha-256"
        rpk security acl create --allow-principal "User:$${KAFKA_SASL_USERNAME}" --resource-pattern-type prefixed --topic file. --operation read,write,describe,create $${ADMIN_ARGS} 2>/dev/null || true;
        rpk security acl create --allow-principal "User:$${KAFKA_SASL_USERNAME}" --resource-pattern-type prefixed --topic cache. --operation read,write,describe,create $${ADMIN_ARGS} 2>/dev/null || true;
        rpk security acl create --allow-principal "User:$${KAFKA_SASL_USERNAME}" --resource-pattern-type prefixed --topic edge. --operation read,write,describe,create $${ADMIN_ARGS} 2>/dev/null || true;
        rpk security acl create --allow-principal "User:$${KAFKA_SASL_USERNAME}" --resource-pattern-type prefixed --topic replication. --operation read,write,describe,create $${ADMIN_ARGS} 2>/dev/null || true;
        rpk security acl create --allow-principal "User:$${KAFKA_SASL_USERNAME}" --resource-pattern-type prefixed --topic video. --operation read,write,describe,create $${ADMIN_ARGS} 2>/dev/null || true;
        rpk security acl create --allow-principal "User:$${KAFKA_SASL_USERNAME}" --resource-pattern-type prefixed --group pravah- --operation read,describe $${ADMIN_ARGS} 2>/dev/null || true;
        rpk security acl create --allow-principal "User:$${KAFKA_SASL_USERNAME}" --operation describe --cluster $${ADMIN_ARGS} 2>/dev/null || true;

        rpk security acl create --allow-principal "User:$${KAFKA_EDGE_SASL_USERNAME}" --resource-pattern-type prefixed --topic cache. --operation read,write,describe,create $${ADMIN_ARGS} 2>/dev/null || true;
        rpk security acl create --allow-principal "User:$${KAFKA_EDGE_SASL_USERNAME}" --resource-pattern-type prefixed --topic edge. --operation read,write,describe,create $${ADMIN_ARGS} 2>/dev/null || true;
        rpk security acl create --allow-principal "User:$${KAFKA_EDGE_SASL_USERNAME}" --operation describe --cluster $${ADMIN_ARGS} 2>/dev/null || true;
        echo 'ACLs provisioned successfully';
    restart: "no"
    networks:
      - pravah-net

  # 4. MinIO (S3 Compatible Distributed Object Storage)
  minio:
    image: pravah-minio:latest
    container_name: pravah-minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password}
    volumes:
      - minio_data:/data
    networks:
      - pravah-net

  # 5. Pravah Core Application (Control Plane)
  core-app:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.core
    image: pravah-core:latest
    container_name: pravah-core
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin_postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-pravah_db}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BROKERS=redpanda:9092
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=pravah-core
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
      - EDGE_URL_SIGNING_SECRET=${EDGE_URL_SIGNING_SECRET}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - KAFKA_SASL_USERNAME=${KAFKA_SASL_USERNAME:-pravah-core}
      - KAFKA_SASL_PASSWORD=${KAFKA_SASL_PASSWORD}
      - KAFKA_SASL_MECHANISM=${KAFKA_SASL_MECHANISM:-scram-sha-256}
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_started
      redpanda:
        condition: service_started
      redis:
        condition: service_started
      jaeger:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    networks:
      - pravah-net

  # 6. Prometheus (Global Metrics Aggregator)
  prometheus:
    image: prom/prometheus:latest
    container_name: pravah-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ../../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - pravah-net

  # 7. Grafana Loki (Centralized Log Store)
  loki:
    image: grafana/loki:latest
    container_name: pravah-loki
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - ../../observability/loki-config.yml:/etc/loki/local-config.yaml:ro
    networks:
      - pravah-net

  # 8. Promtail (Core Log Shipper)
  promtail:
    image: grafana/promtail:latest
    container_name: pravah-promtail
    restart: always
    volumes:
      - ../../observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - pravah-net

  # 9. Grafana (Central Control Room Dashboard)
  grafana:
    image: grafana/grafana:latest
    container_name: pravah-grafana
    restart: always
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../../observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../../observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - pravah-net

  # 10. Jaeger (Distributed Tracing UI & OTLP Collector)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: pravah-jaeger
    restart: always
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - pravah-net

  # 11. Pravah Web Dashboard (Control Plane UI)
  dashboard:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dashboard
    image: pravah-dashboard:latest
    container_name: pravah-dashboard
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ../../dashboard:/usr/share/nginx/html:ro
    networks:
      - pravah-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  redpanda_data:
  grafana_data:

networks:
  pravah-net:
    name: pravah-net
