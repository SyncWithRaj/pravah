services:
  # 1. PostgreSQL (Metadata & Edge Node Registry)
  postgres:
    image: postgres:16-alpine
    container_name: pravah-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin_postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-pravah_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pravah-net

  # 2. Redis (Core State, BullMQ Replication Queue & Heartbeats)
  redis:
    image: redis:7-alpine
    container_name: pravah-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pravah-net

  # 3. Redpanda / Kafka (Distributed Event Bus)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: pravah-redpanda
    restart: always
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092,OUTSIDE://${CORE_PUBLIC_IP:-localhost}:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - pravah-net

  # 4. MinIO (S3 Compatible Distributed Object Storage)
  minio:
    image: minio/minio:latest
    container_name: pravah-minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password}
    volumes:
      - minio_data:/data
    networks:
      - pravah-net

  # 5. Pravah Core Application (Control Plane)
  core-app:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.core
    container_name: pravah-core
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin_postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-pravah_db}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BROKERS=redpanda:9092
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=pravah-core
    env_file:
      - ../../.env
    depends_on:
      - postgres
      - minio
      - redpanda
      - redis
      - jaeger
    networks:
      - pravah-net

  # 6. Prometheus (Global Metrics Aggregator)
  prometheus:
    image: prom/prometheus:latest
    container_name: pravah-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ../../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - pravah-net

  # 7. Grafana Loki (Centralized Log Store)
  loki:
    image: grafana/loki:latest
    container_name: pravah-loki
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - ../../observability/loki-config.yml:/etc/loki/local-config.yaml:ro
    networks:
      - pravah-net

  # 8. Promtail (Core Log Shipper)
  promtail:
    image: grafana/promtail:latest
    container_name: pravah-promtail
    restart: always
    volumes:
      - ../../observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - pravah-net

  # 9. Grafana (Central Control Room Dashboard)
  grafana:
    image: grafana/grafana:latest
    container_name: pravah-grafana
    restart: always
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../../observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../../observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - pravah-net

  # 10. Jaeger (Distributed Tracing UI & OTLP Collector)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: pravah-jaeger
    restart: always
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - pravah-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  redpanda_data:
  grafana_data:

networks:
  pravah-net:
    name: pravah-net
