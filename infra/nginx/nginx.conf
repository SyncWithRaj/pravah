user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Linux Kernel Zero-Copy and Network Directives
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Timeout and Connection Handling
    keepalive_timeout 65;
    keepalive_requests 10000;
    reset_timedout_connection on;
    client_body_timeout 15;
    client_header_timeout 15;
    send_timeout 15;

    # Buffer Sizing for Video Segment Streaming
    client_body_buffer_size 128k;
    client_max_body_size 100m;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 16k;

    # Structured CDN Access Log
    log_format cdn_json escape=json '{'
        '"time_local":"$time_local",'
        '"client_ip":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_cache_status":"$upstream_cache_status",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log cdn_json buffer=64k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Gzip Compression for Manifests and Text Playlists
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/vnd.apple.mpegurl
        application/dash+xml
        application/json
        text/plain
        text/xml;

    # Proxy Cache Zones
    # 1. SEGMENT_CACHE: High capacity for static HLS chunks (.ts, .m4s)
    proxy_cache_path /var/cache/nginx/edge_segments
        levels=1:2
        keys_zone=SEGMENT_CACHE:256m
        max_size=20g
        inactive=7d
        use_temp_path=off;

    # 2. MANIFEST_CACHE: In-memory microcache for dynamic playlists (.m3u8, .mpd)
    proxy_cache_path /var/cache/nginx/edge_manifests
        levels=1:2
        keys_zone=MANIFEST_CACHE:32m
        max_size=1g
        inactive=10m
        use_temp_path=off;

    # Upstream Definition for NestJS Edge Service (Primary port 3001, dev fallback port 4001)
    upstream nestjs_edge_upstream {
        server 127.0.0.1:3001 max_fails=1 fail_timeout=5s;
        server 127.0.0.1:4001 backup;
        keepalive 64;
    }

    include /etc/nginx/conf.d/*.conf;
}
