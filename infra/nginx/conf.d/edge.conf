server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Direct Nginx Health Check (Kubernetes / Docker Liveness)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Static Video Chunks (.ts, .m4s, .mp4) - High Capacity Zero-Copy Caching
    location ~* \.(ts|m4s|mp4)$ {
        proxy_cache SEGMENT_CACHE;
        proxy_cache_key $scheme$request_method$host$request_uri;
        proxy_cache_valid 200 206 30d;
        proxy_cache_valid 404 10s;

        # Protect Upstream NestJS from Request Storms
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_revalidate on;
        proxy_cache_background_update on;

        # Upstream Keep-Alive Connection to NestJS
        proxy_pass http://nestjs_edge_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Diagnostic CDN Headers
        add_header X-Proxy-Cache $upstream_cache_status always;
        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin * always;
    }

    # Dynamic HLS Playlists (.m3u8, .mpd) - 1-Second Microcaching
    location ~* \.(m3u8|mpd)$ {
        proxy_cache MANIFEST_CACHE;
        proxy_cache_key $scheme$request_method$host$request_uri;
        proxy_cache_valid 200 1s;
        proxy_cache_valid 404 2s;

        # Prevent Thundering Herd on Live Playlists
        proxy_cache_lock on;
        proxy_cache_lock_timeout 2s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        # Upstream Keep-Alive Connection to NestJS
        proxy_pass http://nestjs_edge_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Diagnostic and Cache Control Headers
        add_header X-Proxy-Cache $upstream_cache_status always;
        add_header Cache-Control "public, max-age=1" always;
        add_header Access-Control-Allow-Origin * always;
    }

    # Application APIs and Control Plane - Bypasses Proxy Cache
    location / {
        proxy_pass http://nestjs_edge_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Proxy-Cache BYPASS always;
        add_header Access-Control-Allow-Origin * always;
    }
}
