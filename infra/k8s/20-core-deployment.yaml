apiVersion: apps/v1
kind: Deployment
metadata:
  name: pravah-core
  namespace: pravah-system
  labels:
    app.kubernetes.io/name: pravah-core
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: pravah
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pravah-core
  template:
    metadata:
      labels:
        app: pravah-core
        app.kubernetes.io/name: pravah-core
        app.kubernetes.io/component: control-plane
    spec:
      serviceAccountName: pravah-core-sa
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL to become ready..."
              until nc -z -w 2 pravah-postgres 5432; do
                echo "Postgres unavailable - sleeping 2s"
                sleep 2
              done
              echo "PostgreSQL is online!"
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Kafka/Redpanda to become ready..."
              until nc -z -w 2 pravah-redpanda 9092; do
                echo "Kafka unavailable - sleeping 2s"
                sleep 2
              done
              echo "Kafka is online!"
      containers:
        - name: core-app
          image: pravah-core-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http-core
          envFrom:
            - configMapRef:
                name: pravah-config
            - secretRef:
                name: pravah-secrets
          env:
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
          readinessProbe:
            httpGet:
              path: /api/v1/metrics
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/metrics
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          volumeMounts:
            - name: transcode-scratch
              mountPath: /tmp/pravah-transcode
      volumes:
        - name: transcode-scratch
          emptyDir: {}
