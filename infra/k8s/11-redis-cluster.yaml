apiVersion: v1
kind: Service
metadata:
  name: pravah-redis
  namespace: pravah-system
  labels:
    app: pravah-redis
spec:
  ports:
    - port: 6379
      name: redis
  clusterIP: None
  selector:
    app: pravah-redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pravah-redis
  namespace: pravah-system
  labels:
    app: pravah-redis
spec:
  serviceName: pravah-redis
  replicas: 1
  selector:
    matchLabels:
      app: pravah-redis
  template:
    metadata:
      labels:
        app: pravah-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - "--appendonly"
            - "yes"
            - "--maxmemory"
            - "1536mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: redis-storage
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
