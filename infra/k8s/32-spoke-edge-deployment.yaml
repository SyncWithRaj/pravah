apiVersion: apps/v1
kind: Deployment
metadata:
  name: pravah-edge
  namespace: pravah-system
  labels:
    app.kubernetes.io/name: pravah-edge
    app.kubernetes.io/component: data-plane
    app.kubernetes.io/part-of: pravah
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pravah-edge
  template:
    metadata:
      labels:
        app: pravah-edge
        app.kubernetes.io/name: pravah-edge
        app.kubernetes.io/component: data-plane
    spec:
      serviceAccountName: pravah-edge-sa
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["pravah-edge"]
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: edge-app
          image: 716659702697.dkr.ecr.ap-south-1.amazonaws.com/pravah-edge-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http-edge
          envFrom:
            - configMapRef:
                name: pravah-config
            - secretRef:
                name: pravah-secrets
          env:
            - name: PORT
              value: "3001"
            - name: EDGE_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: EDGE_REGION
              value: "spoke-region"
            - name: OTEL_SDK_DISABLED
              value: "true"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          volumeMounts:
            - name: edge-ram-cache
              mountPath: /tmp/pravah-edge-cache
        - name: edge-proxy
          image: 716659702697.dkr.ecr.ap-south-1.amazonaws.com/pravah-edge-proxy:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http-proxy
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: edge-proxy-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: edge-ram-cache
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: edge-proxy-cache
          emptyDir: {}
