apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: pravah-secret-store
  namespace: pravah-system
  labels:
    app.kubernetes.io/name: pravah-secret-store
    app.kubernetes.io/part-of: pravah
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: pravah-core-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pravah-secrets
  namespace: pravah-system
  labels:
    app.kubernetes.io/name: pravah-secrets
    app.kubernetes.io/part-of: pravah
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: pravah-secret-store
    kind: SecretStore
  target:
    name: pravah-secrets
    creationPolicy: Owner
  data:
    # Database Credentials
    - secretKey: POSTGRES_USER
      remoteRef:
        key: pravah/production/database
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: pravah/production/database
        property: password
    - secretKey: POSTGRES_DB
      remoteRef:
        key: pravah/production/database
        property: database
    - secretKey: DATABASE_URL
      remoteRef:
        key: pravah/production/database
        property: url

    # MinIO S3 Credentials
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: pravah/production/s3
        property: access_key
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: pravah/production/s3
        property: secret_key

    # JWT Auth Secrets
    - secretKey: JWT_SECRET
      remoteRef:
        key: pravah/production/jwt
        property: secret
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: pravah/production/jwt
        property: refresh_secret
    - secretKey: JWT_EXPIRES_IN
      remoteRef:
        key: pravah/production/jwt
        property: expires_in
    - secretKey: JWT_REFRESH_EXPIRES_IN
      remoteRef:
        key: pravah/production/jwt
        property: refresh_expires_in

    # Inter-Service Internal API Key & Signing Secrets
    - secretKey: INTERNAL_API_KEY
      remoteRef:
        key: pravah/production/internal
        property: api_key
    - secretKey: INTERNAL_SERVICE_SECRET
      remoteRef:
        key: pravah/production/internal
        property: service_secret
    - secretKey: EDGE_URL_SIGNING_SECRET
      remoteRef:
        key: pravah/production/internal
        property: edge_url_signing_secret
