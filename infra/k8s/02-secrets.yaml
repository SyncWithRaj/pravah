apiVersion: v1
kind: Secret
metadata:
  name: pravah-secrets
  namespace: pravah-system
  labels:
    app.kubernetes.io/name: pravah-secrets
    app.kubernetes.io/part-of: pravah
type: Opaque
stringData:
  # Database Credentials
  POSTGRES_USER: "pravah_admin"
  POSTGRES_PASSWORD: "PravahProductionSecurePassword2026!"
  POSTGRES_DB: "pravah_db"
