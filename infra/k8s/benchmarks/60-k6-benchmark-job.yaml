apiVersion: v1
kind: ConfigMap
metadata:
  name: pravah-k6-benchmark-script
  namespace: pravah-system
data:
  benchmark.js: |
    import http from 'k6/http';
    import { check } from 'k6';
    import { Rate, Trend } from 'k6/metrics';

    const errorRate = new Rate('errors');
    const edgeLatency = new Trend('health_latency_ms', true);

    const TARGET_URL = __ENV.TARGET_URL || 'http://pravah-edge-service.pravah-system.svc.cluster.local:3001';

    export const options = {
      scenarios: {
        ramp_to_100k: {
          executor: 'ramping-arrival-rate',
          startRate: 1000,
          timeUnit: '1s',
          preAllocatedVUs: 400,
          maxVUs: 1500,
          stages: [
            { duration: '15s', target: 5000 },   // Warm-up: 5k RPS/pod (25,000 RPS aggregate)
            { duration: '20s', target: 10000 },  // Ramp: 10k RPS/pod (50,000 RPS aggregate)
            { duration: '30s', target: 20000 },  // 🚀 PEAK: 20k RPS/pod (100,000 RPS aggregate sustained!)
            { duration: '15s', target: 5000 },   // Cool-down (25,000 RPS aggregate)
            { duration: '10s', target: 1000 },   // Wind-down
          ],
        },
      },
      thresholds: {
        http_req_duration: ['p(95)<100'],
        errors: ['rate<0.05'],
      },
    };

    const params = {
      headers: {
        'Connection': 'keep-alive',
      },
      timeout: '3s',
    };

    export default function () {
      const res = http.get(`${TARGET_URL}/health`, params);

      const success = check(res, {
        'status is 200': (r) => r.status === 200,
      });

      errorRate.add(!success);
      edgeLatency.add(res.timings.duration);
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pravah-100k-benchmark
  namespace: pravah-system
spec:
  parallelism: 5
  completions: 5
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: pravah-100k-benchmark
    spec:
      restartPolicy: Never
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["pravah-100k-benchmark"]
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: k6
          image: grafana/k6:latest
          imagePullPolicy: IfNotPresent
          command: ["k6", "run", "/scripts/benchmark.js"]
          env:
            - name: TARGET_URL
              value: "http://pravah-edge-service.pravah-system.svc.cluster.local:3001"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1800m"
              memory: "2048Mi"
          volumeMounts:
            - name: script-vol
              mountPath: /scripts
      volumes:
        - name: script-vol
          configMap:
            name: pravah-k6-benchmark-script
