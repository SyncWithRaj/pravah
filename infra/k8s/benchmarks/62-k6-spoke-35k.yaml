apiVersion: v1
kind: ConfigMap
metadata:
  name: pravah-k6-benchmark-spoke
  namespace: pravah-system
data:
  benchmark.js: |
    import http from 'k6/http';
    import { check } from 'k6';
    import { Rate, Trend } from 'k6/metrics';

    const errorRate = new Rate('errors');
    const edgeLatency = new Trend('health_latency_ms', true);

    const TARGET_URL = __ENV.TARGET_URL || 'http://pravah-edge-service.pravah-system.svc.cluster.local:3001';

    export const options = {
      discardResponseBodies: true,
      scenarios: {
        ramp_to_35k: {
          executor: 'ramping-arrival-rate',
          startRate: 1000,
          timeUnit: '1s',
          preAllocatedVUs: 150,
          maxVUs: 350,
          stages: [
            { duration: '15s', target: 3500 },   // Warm-up: 3.5k * 3 = 10,500 RPS
            { duration: '20s', target: 7500 },   // Ramp: 7.5k * 3 = 22,500 RPS
            { duration: '30s', target: 11667 },  // 🚀 PEAK: 11.67k * 3 = 35,000 RPS Sustained
            { duration: '15s', target: 4000 },   // Cool-down
            { duration: '10s', target: 1000 },   // Wind-down
          ],
        },
      },
      thresholds: {
        http_req_duration: ['p(95)<30'],
        errors: ['rate<0.004'],
      },
    };

    const params = {
      headers: {
        'Connection': 'keep-alive',
      },
      timeout: '3s',
    };

    export default function () {
      const res = http.get(`${TARGET_URL}/health`, params);

      const success = check(res, {
        'status is 200': (r) => r.status === 200,
      });

      errorRate.add(!success);
      edgeLatency.add(res.timings.duration);
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pravah-benchmark-spoke-35k
  namespace: pravah-system
spec:
  parallelism: 3
  completions: 3
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: pravah-benchmark-spoke-35k
    spec:
      restartPolicy: Never
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["pravah-benchmark-spoke-35k"]
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: k6
          image: grafana/k6:latest
          imagePullPolicy: IfNotPresent
          command: ["k6", "run", "/scripts/benchmark.js"]
          env:
            - name: TARGET_URL
              value: "http://pravah-edge-service.pravah-system.svc.cluster.local:3001"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "800m"
              memory: "512Mi"
          volumeMounts:
            - name: script-vol
              mountPath: /scripts
      volumes:
        - name: script-vol
          configMap:
            name: pravah-k6-benchmark-spoke
