apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pravah-core-hpa
  namespace: pravah-system
  labels:
    app.kubernetes.io/name: pravah-core-hpa
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: pravah
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pravah-core
  minReplicas: 3
  maxReplicas: 25
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 50
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
      selectPolicy: Min
