name: 'CD Pipeline - Multi-Region AWS Deployment'

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - 'apply'
          - 'destroy'
          - 'update'
      ssh_key_name:
        description: 'EC2 Key Pair Name in AWS'
        required: true
        default: 'pravah-key'

jobs:
  deploy:
    name: Terraform ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Initialize Terraform
        run: terraform init

      - name: Create Terraform Variables File
        run: |
          cat <<EOF > terraform.tfvars
          aws_key_name       = "${{ github.event.inputs.ssh_key_name }}"
          core_instance_type = "t3.medium"
          edge_instance_type = "t3.small"
          core_region        = "ap-south-1"
          github_repo_url    = "https://github.com/${{ github.repository }}.git"
          allowed_ssh_cidr   = "0.0.0.0/0"
          EOF

      # 1. Standard Terraform Apply
      - name: Terraform Apply (Deploy Global CDN On-Demand)
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          terraform apply -auto-approve
          
          CORE_IP=$(terraform output -raw core_public_ip 2>/dev/null || echo "Pending")
          DASHBOARD_URL=$(terraform output -raw dashboard_url 2>/dev/null || echo "Pending")
          GRAFANA_URL=$(terraform output -raw grafana_dashboard_url 2>/dev/null || echo "Pending")
          EDGE_MUMBAI=$(terraform output -raw edge_mumbai_url 2>/dev/null || echo "Pending")
          EDGE_VA=$(terraform output -raw edge_us_east_url 2>/dev/null || echo "Pending")
          EDGE_FRA=$(terraform output -raw edge_eu_central_url 2>/dev/null || echo "Pending")
          
          echo "### 🚀 Pravah CDN — Cloud Deployment Live!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Cloud Endpoint |" >> $GITHUB_STEP_SUMMARY
          echo "|:---|:---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🎛️ **Control Center UI** | [$DASHBOARD_URL]($DASHBOARD_URL) |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚡ **Core API** | http://$CORE_IP:3000/api/v1 |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 **Grafana** | [$GRAFANA_URL]($GRAFANA_URL) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🇮🇳 **Edge Mumbai** | $EDGE_MUMBAI |" >> $GITHUB_STEP_SUMMARY
          echo "| 🇺🇸 **Edge Virginia** | $EDGE_VA |" >> $GITHUB_STEP_SUMMARY
          echo "| 🇩🇪 **Edge Frankfurt** | $EDGE_FRA |" >> $GITHUB_STEP_SUMMARY

      # 2. Standard Terraform Destroy
      - name: Terraform Destroy (Teardown & Stop Charges)
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: |
          terraform destroy -auto-approve
          echo "### 🧹 Pravah CDN Cloud Resources Destroyed — Zero AWS Charges" >> $GITHUB_STEP_SUMMARY

      # 3. Fast Code Update on Running Instances (Zero Infra Rebuilding)
      - name: Update Code on Live Running Instances
        if: ${{ github.event.inputs.action == 'update' }}
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "Error: SSH_PRIVATE_KEY secret is not configured in repository secrets."
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          CORE_IP=$(terraform output -raw core_public_ip)
          EDGE_MUMBAI_IP=$(terraform output -raw edge_mumbai_public_ip)
          EDGE_VA_IP=$(terraform output -raw edge_us_east_public_ip)
          EDGE_FRA_IP=$(terraform output -raw edge_eu_central_public_ip)

          echo "=== 1. Updating Core Server ($CORE_IP) ==="
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@$CORE_IP '
            cd /opt/pravah
            sudo git fetch origin main
            sudo git reset --hard origin/main
            sudo docker compose -f infra/docker/docker-compose.core.yml run --rm core-app pnpm --filter core exec prisma db push --schema=prisma/schema.prisma
            sudo docker compose -f infra/docker/docker-compose.core.yml up -d --build
          '

          echo "=== 2. Updating Edge Nodes ==="
          for EDGE_IP in "$EDGE_MUMBAI_IP" "$EDGE_VA_IP" "$EDGE_FRA_IP"; do
            echo "Updating Edge at $EDGE_IP..."
            ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@$EDGE_IP '
              cd /opt/pravah
              sudo git fetch origin main
              sudo git reset --hard origin/main
              sudo docker compose -f infra/docker/docker-compose.edge.yml up -d --build
            ' || echo "Warning: Failed to update Edge node at $EDGE_IP"
          done

          echo "### 🔄 Pravah CDN — Live Code Updated Successfully across all Nodes!" >> $GITHUB_STEP_SUMMARY
