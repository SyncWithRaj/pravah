name: CD - Multi-Region AWS Cloud Deployment (On-Demand)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - 'apply'
          - 'destroy'
      ssh_key_name:
        description: 'EC2 Key Pair Name in AWS'
        required: true
        default: 'pravah-key'

jobs:
  deploy:
    name: ${{ github.event.inputs.action == 'destroy' && 'Terraform Destroy (Teardown)' || 'Smart Deploy / Fast Sync (AWS)' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Initialize Terraform
        run: terraform init

      - name: Create Terraform Variables File
        run: |
          cat <<EOF > terraform.tfvars
          aws_key_name       = "${{ github.event.inputs.ssh_key_name }}"
          core_instance_type = "t3.medium"
          edge_instance_type = "t3.small"
          core_region        = "ap-south-1"
          github_repo_url    = "https://github.com/${{ github.repository }}.git"
          allowed_ssh_cidr   = "0.0.0.0/0"
          EOF

      # ------------------------------------------------------------------------
      # SMART APPLY: AUTO-DETECTS WHETHER TO FAST-SYNC CODE OR PROVISION FROM SCRATCH
      # ------------------------------------------------------------------------
      - name: Smart Cloud Deployment
        if: ${{ github.event.inputs.action == 'apply' }}
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
        run: |
          # 1. Check if Pravah Core server is already running in AWS
          echo "🔍 Checking if Pravah cluster is already active in AWS (ap-south-1)..."
          RUNNING_CORE_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=pravah-core-server" "Name=instance-state-name,Values=running,pending" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text \
            --region ap-south-1 2>/dev/null || echo "None")

          # --------------------------------------------------------------------
          # CASE A: CLUSTER ALREADY RUNNING -> FAST 10s CODE UPDATE
          # --------------------------------------------------------------------
          if [ -n "$RUNNING_CORE_IP" ] && [ "$RUNNING_CORE_IP" != "None" ]; then
            # Resolve Static Elastic IP if attached
            EIP=$(aws ec2 describe-addresses \
              --filters "Name=tag:Name,Values=pravah-core-eip" \
              --query "Addresses[0].PublicIp" \
              --output text \
              --region ap-south-1 2>/dev/null || echo "$RUNNING_CORE_IP")
            [ -z "$EIP" ] || [ "$EIP" = "None" ] && EIP="$RUNNING_CORE_IP"
            
            echo "⚡ Active cluster detected at IP: $EIP"
            echo "🔄 Fast-syncing latest 'main' code to live instances in 10s..."
            
            if [ -n "$SSH_KEY" ]; then
              mkdir -p ~/.ssh
              echo "$SSH_KEY" > ~/.ssh/id_rsa
              chmod 600 ~/.ssh/id_rsa

              ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@$EIP "
                cd /opt/pravah
                sudo git pull origin main
                sudo docker compose -f infra/docker/docker-compose.core.yml up -d --build
                sudo docker compose -f infra/docker/docker-compose.core.yml run --rm core-app pnpm --filter core exec prisma db seed || true
                sudo docker compose -f infra/docker/docker-compose.core.yml restart core-app dashboard
              "
              echo "✅ Code sync complete on live Core instance!"

              echo "🔄 Syncing remote Edge nodes across regions..."
              for REGION in ap-south-1 us-east-1 eu-central-1; do
                EDGE_IPS=$(aws ec2 describe-instances --region $REGION --filters "Name=tag:Project,Values=pravah-cdn" "Name=tag:Role,Values=edge-node" "Name=instance-state-name,Values=running" --query "Reservations[*].Instances[*].PublicIpAddress" --output text 2>/dev/null || echo "")
                for E_IP in $EDGE_IPS; do
                  if [ -n "$E_IP" ] && [ "$E_IP" != "None" ]; then
                    echo "⚡ Syncing Edge node at $E_IP ($REGION)..."
                    ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@$E_IP "
                      cd /opt/pravah
                      sudo git pull origin main
                      sudo docker compose -f infra/docker/docker-compose.edge.yml up -d --build
                      sudo docker compose -f infra/docker/docker-compose.edge.yml restart edge-app
                    " || true
                  fi
                done
              done
              echo "✅ All Edge nodes synced and healthy!"
            fi

            echo "### ⚡ Pravah CDN — Live Code Updated (10s Sync)!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Cluster was already running. Synced latest code from \`main\` with 0 infrastructure downtime."
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Service | Cloud Endpoint |" >> $GITHUB_STEP_SUMMARY
            echo "|:---|:---|" >> $GITHUB_STEP_SUMMARY
            echo "| 🎛️ **Control Center UI** | [http://$EIP:8080](http://$EIP:8080) |" >> $GITHUB_STEP_SUMMARY
            echo "| ⚡ **Core API** | http://$EIP:3000/api/v1 |" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # --------------------------------------------------------------------
          # CASE B: NO CLUSTER RUNNING -> PROVISION FRESH MULTI-REGION INFRASTRUCTURE
          # --------------------------------------------------------------------
          echo "🚀 No active cluster found. Provisioning fresh Multi-Region AWS Cluster with Terraform..."
          terraform apply -auto-approve
          
          CORE_IP=$(terraform output -raw core_public_ip 2>/dev/null || echo "Pending")
          DASHBOARD_URL=$(terraform output -raw dashboard_url 2>/dev/null || echo "Pending")
          GRAFANA_URL=$(terraform output -raw grafana_dashboard_url 2>/dev/null || echo "Pending")
          EDGE_MUMBAI=$(terraform output -raw edge_mumbai_url 2>/dev/null || echo "Pending")
          EDGE_VA=$(terraform output -raw edge_us_east_url 2>/dev/null || echo "Pending")
          EDGE_FRA=$(terraform output -raw edge_eu_central_url 2>/dev/null || echo "Pending")
          
          echo "### 🚀 Pravah CDN — Fresh Multi-Region Cluster Live!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Cloud Endpoint |" >> $GITHUB_STEP_SUMMARY
          echo "|:---|:---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🎛️ **Control Center UI** | [$DASHBOARD_URL]($DASHBOARD_URL) |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚡ **Core API** | http://$CORE_IP:3000/api/v1 |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 **Grafana** | [$GRAFANA_URL]($GRAFANA_URL) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🇮🇳 **Edge Mumbai** | $EDGE_MUMBAI |" >> $GITHUB_STEP_SUMMARY
          echo "| 🇺🇸 **Edge Virginia** | $EDGE_VA |" >> $GITHUB_STEP_SUMMARY
          echo "| 🇩🇪 **Edge Frankfurt** | $EDGE_FRA |" >> $GITHUB_STEP_SUMMARY

      # ------------------------------------------------------------------------
      # TEARDOWN & DESTROY
      # ------------------------------------------------------------------------
      - name: Terraform Destroy (Teardown & Stop Charges)
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: |
          terraform destroy -auto-approve
          echo "### 🧹 Pravah CDN Cloud Resources Destroyed — Zero AWS Charges" >> $GITHUB_STEP_SUMMARY
