name: CD - Multi-Region AWS Cloud Deployment (On-Demand)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - 'apply'
          - 'update_code'
          - 'destroy'
          - 'plan'
      ssh_key_name:
        description: 'EC2 Key Pair Name in AWS'
        required: true
        default: 'pravah-key'

jobs:
  deploy:
    name: ${{ github.event.inputs.action == 'update_code' && 'Fast Live Code Sync (10s)' || format('Terraform {0}', github.event.inputs.action) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Initialize Terraform
        run: terraform init

      - name: Create Terraform Variables File
        run: |
          cat <<EOF > terraform.tfvars
          aws_key_name       = "${{ github.event.inputs.ssh_key_name }}"
          core_instance_type = "t3.medium"
          edge_instance_type = "t3.small"
          core_region        = "ap-south-1"
          github_repo_url    = "https://github.com/${{ github.repository }}.git"
          allowed_ssh_cidr   = "0.0.0.0/0"
          EOF

      # ------------------------------------------------------------------------
      # 1. DRY-RUN PLAN
      # ------------------------------------------------------------------------
      - name: Terraform Plan
        if: ${{ github.event.inputs.action == 'plan' }}
        run: terraform plan

      # ------------------------------------------------------------------------
      # 2. FULL PROVISION / APPLY
      # ------------------------------------------------------------------------
      - name: Terraform Apply (Deploy Global CDN On-Demand)
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          terraform apply -auto-approve
          
          CORE_IP=$(terraform output -raw core_public_ip 2>/dev/null || echo "Pending")
          DASHBOARD_URL=$(terraform output -raw dashboard_url 2>/dev/null || echo "Pending")
          GRAFANA_URL=$(terraform output -raw grafana_dashboard_url 2>/dev/null || echo "Pending")
          EDGE_MUMBAI=$(terraform output -raw edge_mumbai_url 2>/dev/null || echo "Pending")
          EDGE_VA=$(terraform output -raw edge_us_east_url 2>/dev/null || echo "Pending")
          EDGE_FRA=$(terraform output -raw edge_eu_central_url 2>/dev/null || echo "Pending")
          
          echo "### 🚀 Pravah CDN — Cloud Deployment Live!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Cloud Endpoint |" >> $GITHUB_STEP_SUMMARY
          echo "|:---|:---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🎛️ **Control Center UI** | [$DASHBOARD_URL]($DASHBOARD_URL) |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚡ **Core API** | http://$CORE_IP:3000/api/v1 |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 **Grafana** | [$GRAFANA_URL]($GRAFANA_URL) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🇮🇳 **Edge Mumbai** | $EDGE_MUMBAI |" >> $GITHUB_STEP_SUMMARY
          echo "| 🇺🇸 **Edge Virginia** | $EDGE_VA |" >> $GITHUB_STEP_SUMMARY
          echo "| 🇩🇪 **Edge Frankfurt** | $EDGE_FRA |" >> $GITHUB_STEP_SUMMARY

      # ------------------------------------------------------------------------
      # 3. FAST LIVE CODE SYNC (PULL MAIN TO RUNNING EC2 INSTANCES IN 10s)
      # ------------------------------------------------------------------------
      - name: Fast Live Code Sync (Pull Latest Code on Running Cluster)
        if: ${{ github.event.inputs.action == 'update_code' }}
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
        run: |
          # 1. Try resolving Elastic IP directly, fallback to instance IP
          CORE_IP=$(terraform output -raw core_public_ip 2>/dev/null || echo "")
          if [ -z "$CORE_IP" ] || [ "$CORE_IP" = "Pending" ]; then
            echo "🔍 Querying AWS for Pravah Core Elastic IP in ap-south-1..."
            CORE_IP=$(aws ec2 describe-addresses \
              --filters "Name=tag:Name,Values=pravah-core-eip" \
              --query "Addresses[0].PublicIp" \
              --output text \
              --region ap-south-1 2>/dev/null || echo "")
          fi
          if [ -z "$CORE_IP" ] || [ "$CORE_IP" = "None" ]; then
            CORE_IP=$(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=pravah-core-server" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].PublicIpAddress" \
              --output text \
              --region ap-south-1 2>/dev/null || echo "")
          fi

          if [ -z "$CORE_IP" ] || [ "$CORE_IP" = "None" ]; then
            echo "❌ No running Pravah Core instance found in AWS (ap-south-1)."
            echo "Run 'apply' action first to launch the cluster."
            exit 1
          fi

          echo "✅ Found running Core server at: $CORE_IP"
          DASHBOARD_URL="http://$CORE_IP:8080"

          if [ -n "$SSH_KEY" ]; then
            echo "Connecting to Core instance at $CORE_IP via SSH to pull latest code..."
            mkdir -p ~/.ssh
            echo "$SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa

            ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@$CORE_IP "
              cd /opt/pravah
              sudo git pull origin main
              sudo docker compose -f infra/docker/docker-compose.core.yml run --rm core-app pnpm --filter core exec prisma db seed || true
              sudo docker compose -f infra/docker/docker-compose.core.yml restart core-app
              sudo pkill -f 'http.server' || true
              sudo nohup python3 -m http.server 8080 --directory dashboard </dev/null >/var/log/pravah-ui.log 2>&1 &
              sleep 2
              exit 0
            " || true
            echo "✅ Code sync complete on Core instance!"
          else
            echo "⚠️ No SSH private key found in GitHub Secrets (EC2_SSH_PRIVATE_KEY)."
            echo "To sync manually from your terminal, run:"
            echo "ssh -i <your-key.pem> ubuntu@$CORE_IP 'cd /opt/pravah && sudo git pull origin main && sudo docker compose restart'"
          fi

          echo "### 🔄 Pravah CDN — Live Code Updated!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Latest code from \`main\` has been pulled to the live AWS cluster."
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Cloud Endpoint |" >> $GITHUB_STEP_SUMMARY
          echo "|:---|:---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🎛️ **Control Center UI** | [$DASHBOARD_URL]($DASHBOARD_URL) |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚡ **Core API** | http://$CORE_IP:3000/api/v1 |" >> $GITHUB_STEP_SUMMARY

      # ------------------------------------------------------------------------
      # 4. TEARDOWN & DESTROY
      # ------------------------------------------------------------------------
      - name: Terraform Destroy (Teardown & Stop Charges)
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: |
          terraform destroy -auto-approve
          echo "### 🧹 Pravah CDN Cloud Resources Destroyed — Zero AWS Charges" >> $GITHUB_STEP_SUMMARY
